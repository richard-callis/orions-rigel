services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: training_app
      POSTGRES_PASSWORD: training_dev_password
      POSTGRES_DB: technical_training
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training_app -d technical_training"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending Prisma migrations, then exits. `app` waits for
  # this to succeed before it starts, so schema is always in sync on boot.
  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://training_app:training_dev_password@db:5432/technical_training?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://training_app:training_dev_password@db:5432/technical_training?schema=public
      # Required — no default. A well-known fallback here would let anyone forge a
      # session JWT for any user (including ADMIN), since Auth.js trusts token.id as
      # authoritative. Generate one with: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set — generate one with: openssl rand -base64 32}
      # Needed so Auth.js trusts the host/proto it's reached through when
      # sitting behind a reverse proxy or load balancer (see README).
      AUTH_TRUST_HOST: "true"
      # Optional — only needed for /admin/create-training (AI-assisted
      # training drafting). Leave unset to skip that feature.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
