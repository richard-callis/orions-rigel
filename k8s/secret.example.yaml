# Template only — do NOT commit real values. Create the actual Secret with:
#
#   kubectl create secret generic technical-training-secrets \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/technical_training?schema=public' \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 32)"
#
# or manage it through your cluster's secrets tooling (External Secrets
# Operator, Sealed Secrets, Vault, cloud provider secret manager, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: technical-training-secrets
type: Opaque
stringData:
  # Host is "postgres-dev" only if you're using k8s/postgres-dev.yaml (the
  # bundled dev/eval Postgres) — point at your managed database otherwise.
  # If you do use postgres-dev.yaml, the password here must match the
  # POSTGRES_PASSWORD set there.
  DATABASE_URL: "postgresql://training_app:CHANGE-ME@postgres-dev:5432/technical_training?schema=public"
  AUTH_SECRET: "CHANGE-ME-generate-with-openssl-rand-base64-32"
  # Optional — only needed for /admin/create-training (AI-assisted training
  # drafting). Omit this key entirely if you don't want that feature.
  # ANTHROPIC_API_KEY: "sk-ant-..."
